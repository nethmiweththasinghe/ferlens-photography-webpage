<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         TITLE & META DESCRIPTION
         ============================================================ -->
    <title>Auckland Wedding Photographer | FernLens Photography — NZ-Wide</title>
    <meta
      name="description"
      content="FernLens Photography — Auckland wedding photographer available NZ-wide. Candid, natural wedding photography plus portraits, lifestyle, and elopements. Book your session today."
    />
    <meta name="robots" content="index, follow" />

    <!-- ============================================================
         CANONICAL URL
         ============================================================ -->
    <link rel="canonical" href="https://www.fernlensphotography.nz/" />

    <!-- ============================================================
         FAVICON
         ============================================================ -->
    <link rel="icon" type="image/svg+xml" href="/photos/logo.png" />

    <!-- ============================================================
         OPEN GRAPH (Facebook, LinkedIn, WhatsApp previews)
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FernLens Photography" />
    <meta property="og:url" content="https://www.fernlensphotography.nz/" />
    <meta
      property="og:title"
      content="Auckland Wedding Photographer | FernLens Photography"
    />
    <meta
      property="og:description"
      content="Candid, natural wedding photography based in Auckland — available NZ-wide. Portraits, lifestyle & elopements also available."
    />
    <meta
      property="og:image"
      content="https://www.fernlensphotography.nz/photos/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NZ" />

    <!-- ============================================================
         TWITTER / X CARD
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Auckland Wedding Photographer | FernLens Photography"
    />
    <meta
      name="twitter:description"
      content="Candid, natural wedding photography based in Auckland — available NZ-wide. Portraits, lifestyle & elopements also available."
    />
    <meta
      name="twitter:image"
      content="https://www.fernlensphotography.nz/photos/og-image.jpg"
    />

    <!-- ============================================================
         STRUCTURED DATA — LOCAL BUSINESS + PHOTOGRAPHER (JSON-LD)
         ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "ProfessionalService"],
      "name": "FernLens Photography",
      "url": "https://www.fernlensphotography.nz/",
      "logo": "https://www.fernlensphotography.nz/photos/logo.png",
      "image": "https://www.fernlensphotography.nz/photos/og-image.jpg",
      "description": "Auckland wedding photographer available NZ-wide. Specialising in candid, natural wedding photography, elopements, portraits, and lifestyle sessions.",
      "priceRange": "$$",
      "telephone": "YOUR_PHONE",
      "email": "YOUR_EMAIL",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Auckland",
        "addressRegion": "Auckland",
        "addressCountry": "NZ"
      },
      "areaServed": {
        "@type": "Country",
        "name": "New Zealand"
      },
      "sameAs": [
        "https://www.instagram.com/fernlensphotography",
        "https://linktr.ee/fernlensphotography"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Photography Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Wedding Photography",
              "description": "Full-day and half-day wedding photography coverage across New Zealand."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Elopement Photography",
              "description": "Intimate elopement sessions in Auckland and across New Zealand."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Portrait Photography",
              "description": "Individual and couple portrait sessions in Auckland."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Lifestyle Photography",
              "description": "Natural, candid lifestyle photography sessions."
            }
          }
        ]
      }
    }
    </script>

    <!-- ============================================================
         GOOGLE FONTS
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=DM+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Koalendar Popup Widget Start -->
    <script>
      window.Koalendar =
        window.Koalendar ||
        function () {
          (Koalendar.props = Koalendar.props || []).push(arguments);
        };
    </script>
    <script async src="https://koalendar.com/assets/widget.js"></script>
    <script>
      Koalendar("widget", {
        url: "https://koalendar.com/e/book-a-session-24",
        text: "BOOK A SESSION",
        shape: "rounded-full",
        backgroundColor: "#ffffff",
        textColor: "#9a6f38",
        border: "1px solid #9a6f38",
        position: "bottom-right",
        icon: "calendar",
      });
    </script>
    <!-- Koalendar Popup Widget End -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
